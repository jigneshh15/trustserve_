spring.datasource.url=${DB_URL:jdbc:h2:file:./data/trustserve}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
trustserve.seed=${SEED_DEMO:true}
trustserve.demo-password=${DEMO_PASSWORD:}
trustserve.storage=${STORAGE_PATH:./data/uploads}
logging.level.org.springframework.security=DEBUG