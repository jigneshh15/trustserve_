services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trustserve
      POSTGRES_USER: trustserve
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustserve"]
      interval: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/trustserve
      DB_USER: trustserve
      DB_PASSWORD: ${DB_PASSWORD}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
    volumes:
      - uploads:/app/data
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
volumes:
  dbdata:
  uploads:
